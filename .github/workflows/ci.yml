name: CI

on:
  push:
    branches: [main]
  # Unfiltered so a PR based on another PR's branch still gets checks.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The default branch is exempt so every commit on main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Outside the version matrix: ruff's target-version is pinned in
  # pyproject.toml, so the result cannot differ between interpreters.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # --locked fails the job when uv.lock no longer matches pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Audit workflows with zizmor
        run: uv run zizmor --format=github .github/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15", "3.14", "3.13", "3.12", "3.11"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Sets UV_PYTHON, which outranks the committed .python-version file.
          # Without this the matrix is inert: `uv python install` only downloads
          # an interpreter, so every leg resolved to .python-version.
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run type checking
        # Overrides [tool.ty.environment] python-version, which matches
        # .python-version for local development.
        run: uv run ty check src/ --python-version ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: uv run pytest --ignore=tests/integration --cov=second_hand --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.15'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the image the compose service names, with layer caching. The
      # run step below then uses it as-is, so it must not pass --build.
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.test
          tags: second-hand-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration tests
        run: docker compose -f docker/docker-compose.test.yml run --rm test-integration
