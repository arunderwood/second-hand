version: 2
# A release younger than the cooldown is skipped, which leaves time for a
# compromised or broken one to be yanked. Security updates ignore it.
updates:
  - package-ecosystem: "uv"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/docker"
    schedule:
      interval: "daily"
    ignore:
      # fauust/docker-systemd version is managed by CI matrix in release.yml.
      # We test on both debian-12 (matches build target) and debian-13 (forward
      # compatibility). The Dockerfile uses ARG to select version at build time.
      - dependency-name: "ghcr.io/fauust/docker-systemd"
