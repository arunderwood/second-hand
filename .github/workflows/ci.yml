name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15", "3.14", "3.13", "3.12", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          # Sets UV_PYTHON, which outranks the committed .python-version file.
          # Without this the matrix is inert: `uv python install` only downloads
          # an interpreter, so every leg resolved to .python-version (3.14).
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run type checking
        # Overrides [tool.ty.environment] python-version, which is pinned to
        # 3.14 for local development.
        run: uv run ty check src/ --python-version ${{ matrix.python-version }}

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests with coverage
        run: uv run pytest --ignore=tests/integration --cov=second_hand --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.14'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.test
          tags: second-hand-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration tests
        run: |
          docker run --rm --cap-add=SYS_TIME second-hand-test:latest \
            sh -c "chronyd && sleep 2 && uv run pytest tests/integration -v --tb=short"
