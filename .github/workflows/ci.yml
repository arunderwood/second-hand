name: CI

on:
  push:
    branches: [main]
  # Unfiltered so a PR based on another PR's branch still gets checks.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The default branch is exempt so every commit on main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Outside the version matrix: ruff's target-version is pinned in
  # pyproject.toml, so the result cannot differ between interpreters.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13", "3.12", "3.11"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Sets UV_PYTHON, which outranks the committed .python-version file.
          # Without this the matrix is inert: `uv python install` only downloads
          # an interpreter, so every leg resolved to .python-version (3.14).
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run type checking
        # Overrides [tool.ty.environment] python-version, which is pinned to
        # 3.14 for local development.
        run: uv run ty check src/ --python-version ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: uv run pytest --ignore=tests/integration --cov=second_hand --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.14'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.test
          tags: second-hand-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration tests
        run: |
          docker run --rm --cap-add=SYS_TIME second-hand-test:latest \
            sh -c "chronyd && timeout 10 sh -c 'until [ -S /run/chrony/chronyd.sock ]; do sleep 0.2; done' && uv run pytest tests/integration -v --tb=short"
