name: Build and Release

on:
  release:
    types: [published]
  # Without this, packaging changes get no CI feedback until a release is cut,
  # which is how several packaging bugs reached releases. Any PR touching a
  # packaging input builds and tests the .deb; only upload-release is gated on
  # the release event.
  pull_request:
    paths:
      - debian/**
      # pex resolves dependencies and itself from these.
      - pyproject.toml
      - uv.lock
      - scripts/build-pex.sh
      - docker/Dockerfile.deb-test
      - docker/test-deb.sh
      - .github/workflows/release.yml

permissions:
  contents: read

# A superseded PR run is safe to cancel. A release run is not: cancelling it
# mid-upload leaves a published release missing assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    # Trixie, not the oldest supported release: its debhelper installs the
    # systemd unit under /usr/lib, as merged-/usr requires. The pex bundles
    # wheels for every supported Python whatever the build host runs.
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
          fetch-depth: 0  # Required for hatch-vcs to read git tags

      - name: Install build dependencies
        run: |
          apt-get update
          # Recommends add about 170 packages to the ~270 the build needs; nothing
          # in the build or lintian uses them. libdistro-info-perl is the one
          # recommend kept: without it dch cannot validate release names.
          apt-get install -y --no-install-recommends \
            debhelper \
            python3 \
            python3-venv \
            ca-certificates \
            build-essential \
            libffi-dev \
            git \
            devscripts \
            libdistro-info-perl \
            lintian

      # scripts/build-pex.sh resolves dependencies and pex from uv.lock.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # Runs on pull_request as well as on releases. This is the only step that
      # regenerates the changelog entry and its trailer, and the lintian gate
      # below is what rejects a malformed one; gating this on the release event
      # would leave the rewrite unexercised until a tag is already published.
      - name: Update debian/changelog from release
        working-directory: source
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          TAG: ${{ github.event.release.tag_name }}
          # dch builds the trailer from these. Without them it falls back to
          # root@<container-id>, which lintian rejects as a bogus mail host.
          # Keep in sync with the Maintainer field in debian/control.
          DEBEMAIL: arunderwood@users.noreply.github.com
          DEBFULLNAME: Arunderwood
        run: |
          VERSION="$TAG"
          VERSION="${VERSION#v}"
          # No tag outside a release. Stamp the newest release tag with a +ci
          # suffix: dpkg sorts that above the release, so test-deb-upgrade can
          # install this build over it, and a PR-built .deb is never mistaken
          # for a release.
          if [ -z "$VERSION" ]; then
            git config --global --add safe.directory "$PWD"
            VERSION="$(git describe --tags --abbrev=0 --match 'v*')"
            VERSION="${VERSION#v}+ci"
            RELEASE_BODY="Changelog rewrite exercised by CI; not a release build."
          fi

          # Create new version entry (-b forces version even if "lower" than current)
          dch -b --newversion "${VERSION}-1" --distribution stable ""

          # One bullet per line of the release notes. The body is markdown and
          # may arrive CRLF-terminated, and a line holding just CR is not empty
          # to the shell, so normalize line endings before splitting.
          printf '%s\n' "$RELEASE_BODY" | tr -d '\r' | while IFS= read -r line; do
            line=$(printf '%s\n' "$line" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            # A heading titles a section rather than describing a change, and the
            # bullets beneath it already carry the content. Tested while the "#"
            # is still there: stripped of markers, a heading reads as prose.
            case "$line" in
              '' | '#'*) continue ;;
            esac
            # dch re-wraps but does not interpret, so any markdown surviving here
            # ships to users as literal punctuation in changelog.Debian.gz.
            line=$(printf '%s\n' "$line" | sed 's/^[*-]*[[:space:]]*//; s/\*\*//g')
            # The compare link is a bare URL with no prose a reader can use.
            case "$line" in
              '' | 'Full Changelog:'*) continue ;;
            esac
            dch -a "$line"
          done

      - name: Build .deb package
        working-directory: source
        run: |
          # The changelog step above has already stamped the version being built,
          # so read it back instead of re-deriving it from the event payload.
          # SETUPTOOLS_SCM_PRETEND_VERSION wants the upstream version alone, so
          # drop the Debian revision and the pex and the .deb agree.
          VERSION="$(dpkg-parsechangelog -S Version)"
          export SETUPTOOLS_SCM_PRETEND_VERSION="${VERSION%-*}"
          dpkg-buildpackage -us -uc -b

      - name: Lint .deb package
        run: |
          # The .deb lands beside the source dir. Both suppressed tags apply
          # only to uploads to the Debian archive.
          lintian --fail-on error,warning \
                  --suppress-tags initial-upload-closes-no-bugs,no-manual-page \
                  ./*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: "*.deb"
          retention-days: 1

  test-deb:
    needs: build-deb
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 12 (bookworm) - Python 3.11
          - runner: ubuntu-latest
            arch: amd64
            debian_version: debian-12
          - runner: ubuntu-24.04-arm
            arch: arm64
            debian_version: debian-12
          # Debian 13 (trixie) - Python 3.13
          - runner: ubuntu-latest
            arch: amd64
            debian_version: debian-13
          - runner: ubuntu-24.04-arm
            arch: arm64
            debian_version: debian-13
          # Ubuntu 24.04 (noble) - Python 3.12
          - runner: ubuntu-latest
            arch: amd64
            debian_version: ubuntu-24.04
          - runner: ubuntu-24.04-arm
            arch: arm64
            debian_version: ubuntu-24.04
          # Ubuntu 26.04 (resolute) - Python 3.14
          - runner: ubuntu-latest
            arch: amd64
            debian_version: ubuntu-26.04
          - runner: ubuntu-24.04-arm
            arch: arm64
            debian_version: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download .deb artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: docker/

      - name: Build test image
        run: |
          docker build \
            --build-arg DEBIAN_VERSION=${{ matrix.debian_version }} \
            -t second-hand-deb-test:latest \
            -f docker/Dockerfile.deb-test docker/

      - name: Run .deb integration tests
        run: |
          chmod +x docker/test-deb.sh
          docker/test-deb.sh

  # Hosts upgrade rather than install fresh, and an upgrade runs the old
  # package's maintainer scripts against the new one's. Installs the newest
  # released .deb, then upgrades it in place to this build.
  test-deb-upgrade:
    needs: build-deb
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this build's .deb
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: new/

      # The newest release that carries a .deb for this architecture. On a
      # release event the release being published has none yet, so a plain
      # "latest" lookup would find nothing to upgrade from.
      - name: Download the previous release's .deb
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq \
            "[.[] | select(any(.assets[]; .name | endswith(\"_${ARCH}.deb\")))][0].tag_name")"
          echo "Upgrading from $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "*_${ARCH}.deb" --dir docker/

      - name: Build test image with the previous release
        run: |
          docker build \
            --build-arg DEBIAN_VERSION=debian-12 \
            -t second-hand-deb-test:latest \
            -f docker/Dockerfile.deb-test docker/

      - name: Upgrade to this build and run .deb integration tests
        run: |
          chmod +x docker/test-deb.sh
          UPGRADE_TO="$(ls new/*.deb)" docker/test-deb.sh

  upload-release:
    needs: [test-deb, test-deb-upgrade]
    if: github.event_name == 'release'
    permissions:
      contents: write
      # Signing the provenance attestation for the uploaded packages.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deb-*
          merge-multiple: true

      - name: Write checksums
        run: sha256sum ./*.deb | sed 's| \./| |' > SHA256SUMS

      # Lets a consumer prove a .deb was built by this workflow from this
      # commit: `gh attestation verify <file>.deb --repo <owner>/second-hand`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.deb"

      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" "$TAG" ./*.deb SHA256SUMS

  # A release whose assets never uploaded still looks published: consumers that
  # resolve "newest tag carrying a .deb" quietly stay on the previous version.
  # This job runs whatever happened upstream so that outcome is a red check
  # naming the missing architecture, not a silent no-op.
  verify-release-assets:
    needs: upload-release
    if: ${{ always() && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert the release carries a .deb for every architecture
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          assets="$(gh release view --repo "$GITHUB_REPOSITORY" "$TAG" \
                      --json assets --jq '.assets[].name')"
          echo "Assets on $TAG:"
          echo "${assets:-  (none)}"

          missing=0
          for arch in amd64 arm64; do
            if ! echo "$assets" | grep -q "_${arch}\.deb$"; then
              echo "::error::$TAG has no ${arch} .deb attached."
              missing=1
            fi
          done
          exit "$missing"
