name: CI

on:
  push:
    branches: [main]
  # Unfiltered so a PR based on another PR's branch still gets checks.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The default branch is exempt so every commit on main gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Outside the version matrix: ruff's target-version is pinned in
  # pyproject.toml, so the result cannot differ between interpreters.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # --locked fails the job when uv.lock no longer matches pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Audit workflows with zizmor
        run: uv run zizmor --format=github .github/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.15", "3.14", "3.13", "3.12", "3.11"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Sets UV_PYTHON, which outranks the committed .python-version file.
          # Without this the matrix is inert: `uv python install` only downloads
          # an interpreter, so every leg resolved to .python-version.
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run type checking
        # Overrides [tool.ty.environment] python-version, which matches
        # .python-version for local development.
        run: uv run ty check src/ --python-version ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: uv run pytest --ignore=tests/integration --ignore=tests/browser --cov=second_hand --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.15'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # The image must carry the browsers its Playwright release drives, so its tag
  # comes from uv.lock and a Dependabot bump moves both together.
  playwright-version:
    name: Resolve Playwright Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the locked version
        id: lock
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("uv.lock", "rb") as lock:
              packages = tomllib.load(lock)["package"]
          version = next(p["version"] for p in packages if p["name"] == "playwright")
          print(f"version={version}")
          EOF

  # Outside the version matrix: what it measures is each browser's layout of the
  # stylesheet, which the interpreter has no say in.
  layout-test:
    name: Layout Tests (${{ matrix.browser }})
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Browsers and their system libraries come baked in; installing WebKit's takes
    # minutes on every run. --ipc=host avoids Chromium memory-pressure crashes, and
    # --init reaps browser child processes.
    container:
      image: mcr.microsoft.com/playwright/python:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      LAYOUT_BROWSER: ${{ matrix.browser }}
      # Firefox refuses to run as root under the container's default HOME, which
      # another user owns.
      HOME: /root
      # git refuses a checkout another user owns, so hatch-vcs can't read a version.
      SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --locked --group browser

      - name: Run layout tests
        run: uv run --group browser pytest tests/browser

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-screenshots-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the image the compose service names, with layer caching. The
      # run step below then uses it as-is, so it must not pass --build.
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.test
          tags: second-hand-test:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration tests
        run: docker compose -f docker/docker-compose.test.yml run --rm test-integration
